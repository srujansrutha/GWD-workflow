name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: System libraries for OpenCV
        run: sudo apt-get update && sudo apt-get install -y libgl1

      - name: Install dependencies (CPU-only PyTorch keeps the download small)
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt ruff

      - name: Lint
        run: ruff check .

      - name: Tests
        # No GPU, network or language model is needed: the detector, weather, forecast and geocoder are stubbed.
        run: python -m pytest
