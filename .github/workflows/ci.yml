name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: System libraries for OpenCV
        run: sudo apt-get update && sudo apt-get install -y libgl1

      - name: Install dependencies (CPU-only PyTorch keeps the download small)
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt ruff

      - name: Lint
        run: ruff check .

      - name: Tests
        # No GPU, network or language model is needed: the detector, weather, forecast and geocoder are stubbed.
        run: python -m pytest

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Check both compose files
        run: |
          docker compose config --quiet
          docker compose -f compose.yaml -f compose.gpu.yaml config --quiet

      - name: Build the app image (CPU)
        run: docker compose build app

      - name: Start the app and wait for its health check
        run: |
          docker compose up -d --no-deps app
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8501/_stcore/health && break
            sleep 4
          done
          curl -fsS http://localhost:8501/_stcore/health
          docker compose exec -T app python -c "import advisor.graph, wheat_detector; print('imports ok')"

      - name: App logs
        if: failure()
        run: docker compose logs app

      - name: Stop
        if: always()
        run: docker compose down
